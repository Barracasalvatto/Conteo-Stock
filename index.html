<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a3a2a">
<title>Conteo de Stock</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap');
  :root {
    --bg:#0f1f16;--bg2:#162b1e;--bg3:#1e3828;
    --accent:#4ade80;--accent2:#86efac;
    --accent-dim:rgba(74,222,128,0.15);--accent-dim2:rgba(74,222,128,0.08);
    --text:#e8f5ee;--text2:#9dbfaa;--text3:#5a8a6a;
    --danger:#f87171;--border:rgba(74,222,128,0.2);
    --radius:14px;--radius-sm:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

  /* HOME */
  #screen-home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;
    background:radial-gradient(ellipse at 20% 20%,rgba(74,222,128,0.12) 0%,transparent 60%),
               radial-gradient(ellipse at 80% 80%,rgba(74,222,128,0.06) 0%,transparent 50%),var(--bg);}
  .logo-area{text-align:center;margin-bottom:40px;}
  .logo-icon{width:72px;height:72px;background:var(--accent-dim);border:2px solid var(--accent);border-radius:20px;
    display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 20px;
    box-shadow:0 0 30px rgba(74,222,128,0.2);}
  h1.app-title{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;letter-spacing:-0.5px;}
  h1.app-title span{color:var(--accent);}
  .subtitle{font-size:13px;color:var(--text3);margin-top:6px;font-family:'DM Mono',monospace;}
  .info-card{width:100%;max-width:400px;background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px;}
  .info-card h2{font-family:'Syne',sans-serif;font-size:15px;color:var(--accent2);margin-bottom:16px;}
  .info-pills{display:flex;gap:10px;flex-wrap:wrap;}
  .pill{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 14px;text-align:center;min-width:80px;}
  .pill-num{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--accent);}
  .pill-label{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:2px;}
  .sheet-selector{width:100%;max-width:400px;margin-bottom:16px;}
  .sheet-selector label{display:block;font-size:12px;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;}
  .sheet-selector select{width:100%;background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius-sm);
    color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;padding:12px 16px;appearance:none;cursor:pointer;outline:none;}
  .sheet-selector select:focus{border-color:var(--accent);}
  .btn-primary{width:100%;max-width:400px;background:var(--accent);color:var(--bg);border:none;border-radius:var(--radius);
    padding:16px;font-family:'Syne',sans-serif;font-size:17px;font-weight:700;cursor:pointer;transition:all 0.2s;
    display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-primary:hover{background:var(--accent2);}

  /* COUNT SCREEN */
  #screen-count{display:none;flex-direction:column;min-height:100vh;}
  .topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 16px;
    display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;}
  .btn-back{background:var(--accent-dim);border:1px solid var(--border);border-radius:var(--radius-sm);
    color:var(--accent);padding:8px 12px;font-family:'DM Mono',monospace;font-size:13px;cursor:pointer;white-space:nowrap;}
  .topbar-info{flex:1;overflow:hidden;}
  .topbar-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar-sub{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);margin-top:2px;}
  .progress-bar{height:4px;background:var(--bg3);position:sticky;top:61px;z-index:99;}
  .progress-fill{height:100%;background:var(--accent);transition:width 0.4s ease;border-radius:0 2px 2px 0;}
  .search-bar{padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:65px;z-index:98;}
  .search-wrap{position:relative;}
  .search-bar input{width:100%;background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius-sm);
    color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;padding:10px 14px 10px 36px;outline:none;}
  .search-bar input:focus{border-color:var(--accent);}
  .search-bar input::placeholder{color:var(--text3);}
  .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:16px;pointer-events:none;}
  .product-list{flex:1;padding:12px 16px;display:flex;flex-direction:column;gap:8px;padding-bottom:120px;}
  .product-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;
    display:flex;align-items:center;gap:12px;transition:all 0.15s;}
  .product-card.completed{border-color:var(--accent);background:var(--accent-dim2);}
  .product-card.completed .prod-name{color:var(--accent2);}
  .prod-info{flex:1;overflow:hidden;}
  .prod-name{font-size:14px;font-weight:600;color:var(--text);line-height:1.3;}
  .prod-meta{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;}
  .prod-tag{background:var(--bg3);border-radius:4px;padding:1px 6px;}
  .qty-input{width:80px;background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--radius-sm);
    color:var(--text);font-family:'DM Mono',monospace;font-size:18px;font-weight:500;padding:8px 10px;text-align:center;
    outline:none;-moz-appearance:textfield;flex-shrink:0;}
  .qty-input::-webkit-outer-spin-button,.qty-input::-webkit-inner-spin-button{-webkit-appearance:none;}
  .qty-input:focus{border-color:var(--accent);background:var(--accent-dim2);color:var(--accent);}
  .qty-input.has-value{border-color:var(--accent);color:var(--accent);}
  .cat-divider{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);text-transform:uppercase;
    letter-spacing:1.5px;padding:8px 4px 4px;border-bottom:1px solid var(--border);margin-bottom:4px;}
  .fab-export{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--bg);
    border:none;border-radius:50px;padding:16px 32px;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;
    cursor:pointer;box-shadow:0 8px 32px rgba(74,222,128,0.35);display:flex;align-items:center;gap:8px;z-index:200;white-space:nowrap;transition:all 0.2s;}
  .fab-export:hover{transform:translateX(-50%) translateY(-2px);}
  .fab-count{background:var(--bg);color:var(--accent);border-radius:20px;padding:2px 8px;font-size:13px;}
  .empty-state{text-align:center;padding:48px 24px;color:var(--text3);font-family:'DM Mono',monospace;font-size:13px;}
  .empty-state .emoji{font-size:40px;margin-bottom:12px;}
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg2);
    border:1px solid var(--accent);color:var(--accent);border-radius:50px;padding:10px 20px;font-family:'DM Mono',monospace;
    font-size:13px;opacity:0;transition:all 0.3s;z-index:300;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  ::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:2px;}
</style>
</head>
<body>

<div id="screen-home">
  <div class="logo-area">
    <div class="logo-icon">📦</div>
    <h1 class="app-title">Conteo de <span>Stock</span></h1>
    <p class="subtitle">Yacaré'i · v1.0</p>
  </div>

  <div class="info-card">
    <h2>📋 Planilla cargada</h2>
    <div class="info-pills">
      <div class="pill"><div class="pill-num" id="pill-total">0</div><div class="pill-label">Total</div></div>
      <div class="pill"><div class="pill-num" id="pill-activos">0</div><div class="pill-label">A contar</div></div>
      <div class="pill"><div class="pill-num" id="pill-cats">0</div><div class="pill-label">Categorías</div></div>
    </div>
  </div>

  <div class="sheet-selector">
    <label>Seleccioná la hoja a contar</label>
    <select id="sheet-select"></select>
  </div>

  <button class="btn-primary" id="btn-start">▶ Iniciar conteo</button>
</div>

<div id="screen-count">
  <div class="topbar">
    <button class="btn-back" id="btn-back">← Volver</button>
    <div class="topbar-info">
      <div class="topbar-title" id="topbar-title">Conteo</div>
      <div class="topbar-sub" id="topbar-sub"></div>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  <div class="search-bar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="search" id="search-input" placeholder="Buscar producto..."/>
    </div>
  </div>
  <div class="product-list" id="product-list"></div>
  <button class="fab-export" id="btn-export">⬇ Exportar Excel <span class="fab-count" id="fab-count">0/0</span></button>
</div>

<div class="toast" id="toast"></div>

var workbook = null;
var allProducts = [];
var activeProducts = [];
var quantities = {};
var currentSheet = '';

function showToast(msg,ms){ms=ms||2500;var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},ms);}
function $(id){return document.getElementById(id);}

// Cargar Excel embebido al arrancar
window.addEventListener('load', function(){
  try {
    var binary = atob(EXCEL_B64);
    var bytes = new Uint8Array(binary.length);
    for(var i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    workbook = XLSX.read(bytes.buffer, {type:'array'});
    var sheets = workbook.SheetNames;
    var sel = $('sheet-select');
    sel.innerHTML = '';
    sheets.forEach(function(s){
      var opt = document.createElement('option');
      opt.value = s; opt.textContent = s;
      sel.appendChild(opt);
    });
    loadSheet(sheets[0]);
  } catch(e){ showToast('Error al cargar la planilla'); }
});

$('sheet-select').addEventListener('change', function(){ loadSheet(this.value); });

function loadSheet(sheetName){
  currentSheet = sheetName;
  var ws = workbook.Sheets[sheetName];
  var data = XLSX.utils.sheet_to_json(ws, {defval:''});
  if(!data.length) return;
  var keys = Object.keys(data[0]);
  function findCol(){
    var names = Array.prototype.slice.call(arguments);
    return keys.find(function(k){ return names.some(function(n){ return k.toUpperCase().indexOf(n.toUpperCase())>=0; }); })||'';
  }
  var colContar=findCol('CONTAR'), colNombre=findCol('NOMBRE'), colArticulo=findCol('ARTÍCULO','ARTICULO','COD');
  var colUnidad=findCol('UNIDAD'), colCat=findCol('CATEGORÍA','CATEGORIA');

  allProducts = data
    .filter(function(r){ return r[colNombre] && String(r[colNombre]).trim()!==''; })
    .map(function(r,i){ return {
      idx:i,
      articulo:String(r[colArticulo]||'').trim(),
      nombre:String(r[colNombre]||'').trim(),
      unidad:String(r[colUnidad]||'').trim(),
      categoria:String(r[colCat]||'').trim(),
      contar:String(r[colContar]||'Sí').trim().toUpperCase().charAt(0)==='S'
    };})
    .filter(function(p){ return p.nombre && p.nombre.toLowerCase().indexOf('total')<0; });

  activeProducts = allProducts.filter(function(p){ return p.contar; });
  quantities = {};
  var cats = activeProducts.map(function(p){ return p.categoria; }).filter(function(c,i,a){ return c && a.indexOf(c)===i; });
  $('pill-total').textContent = allProducts.length;
  $('pill-activos').textContent = activeProducts.length;
  $('pill-cats').textContent = cats.length;
}

$('btn-start').addEventListener('click', function(){
  $('screen-home').style.display = 'none';
  $('screen-count').style.display = 'flex';
  $('topbar-title').textContent = currentSheet;
  renderProducts(activeProducts);
  updateProgress();
});

$('btn-back').addEventListener('click', function(){
  if(Object.keys(quantities).length>0 && !confirm('¿Salir? Se perderán las cantidades ingresadas.')) return;
  $('screen-count').style.display = 'none';
  $('screen-home').style.display = 'flex';
  quantities = {};
});

function renderProducts(products){
  var list = $('product-list');
  list.innerHTML = '';
  if(!products.length){ list.innerHTML='<div class="empty-state"><div class="emoji">🔍</div>Sin resultados</div>'; return; }
  var grupos = {};
  products.forEach(function(p){ var c=p.categoria||'Sin categoría'; if(!grupos[c]) grupos[c]=[]; grupos[c].push(p); });
  Object.keys(grupos).forEach(function(cat){
    var div=document.createElement('div'); div.className='cat-divider'; div.textContent=cat; list.appendChild(div);
    grupos[cat].forEach(function(p){
      var card=document.createElement('div');
      card.className='product-card'+(quantities[p.idx]!==undefined?' completed':'');
      card.id='card-'+p.idx;
      var meta=[];
      if(p.articulo) meta.push(p.articulo);
      if(p.unidad) meta.push(p.unidad);
      card.innerHTML='<div class="prod-info"><div class="prod-name">'+p.nombre+'</div>'
        +'<div class="prod-meta">'+meta.map(function(m){ return '<span class="prod-tag">'+m+'</span>'; }).join('')+'</div></div>'
        +'<input type="number" inputmode="numeric" class="qty-input'+(quantities[p.idx]!==undefined?' has-value':'')+'" '
        +'id="qty-'+p.idx+'" placeholder="—" min="0" value="'+(quantities[p.idx]!==undefined?quantities[p.idx]:'')+'">';
      list.appendChild(card);
      var inp=card.querySelector('#qty-'+p.idx);
      inp.addEventListener('input', function(){ handleQty(p.idx, inp); });
    });
  });
}

function handleQty(idx,input){
  var val=input.value.trim();
  if(val===''){ delete quantities[idx]; input.classList.remove('has-value'); $('card-'+idx).classList.remove('completed'); }
  else { quantities[idx]=parseFloat(val)||0; input.classList.add('has-value'); $('card-'+idx).classList.add('completed'); }
  updateProgress();
}

function updateProgress(){
  var total=activeProducts.length, done=Object.keys(quantities).length;
  var pct=total?Math.round(done/total*100):0;
  $('progress-fill').style.width=pct+'%';
  $('topbar-sub').textContent=done+' de '+total+' completados · '+pct+'%';
  $('fab-count').textContent=done+'/'+total;
}

$('search-input').addEventListener('input', function(){
  var q=this.value.toLowerCase().trim();
  if(!q){ renderProducts(activeProducts); return; }
  renderProducts(activeProducts.filter(function(p){
    return p.nombre.toLowerCase().indexOf(q)>=0||p.articulo.toLowerCase().indexOf(q)>=0||p.categoria.toLowerCase().indexOf(q)>=0;
  }));
});

$('btn-export').addEventListener('click', function(){
  var done=Object.keys(quantities).length;
  if(done===0){ showToast('⚠ Ingresá al menos una cantidad'); return; }
  var rows=activeProducts.map(function(p){ return {
    'ARTÍCULO':p.articulo,'NOMBRE':p.nombre,'UNIDAD':p.unidad,'CATEGORÍA':p.categoria,
    'CANTIDAD CONTADA':quantities[p.idx]!==undefined?quantities[p.idx]:'',
    'ESTADO':quantities[p.idx]!==undefined?'Contado':'Pendiente'
  };});
  var wb2=XLSX.utils.book_new();
  var ws2=XLSX.utils.json_to_sheet(rows);
  ws2['!cols']=[{wch:14},{wch:45},{wch:10},{wch:28},{wch:18},{wch:12}];
  XLSX.utils.book_append_sheet(wb2,ws2,currentSheet);
  var resumen=XLSX.utils.aoa_to_sheet([
    ['RESUMEN DE CONTEO'],[],
    ['Hoja:',currentSheet],
    ['Fecha:',new Date().toLocaleDateString('es-PY')],
    ['Hora:',new Date().toLocaleTimeString('es-PY')],[],
    ['Total a contar:',activeProducts.length],
    ['Contados:',done],
    ['Pendientes:',activeProducts.length-done],
    ['Completado:',Math.round(done/activeProducts.length*100)+'%']
  ]);
  XLSX.utils.book_append_sheet(wb2,resumen,'Resumen');
  var fecha=new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb2,'conteo_'+currentSheet.replace(/\s/g,'_')+'_'+fecha+'.xlsx');
  showToast('✓ Excel descargado correctamente');
});
</script>
</body>
</html>
